<!doctype html>
<html lang="zh-CN" data-style="barrier">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>__BRAND_NAME__</title>
<style>/*@css*/</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="me"><span class="ava"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="时序之子标记"></span><div class="me-t"><strong>冥零</strong><small id="side-version"></small></div></div>
    <div class="rail-label" id="rail-label">次元壁垒 · 相伴</div>
    <nav id="nav" aria-label="主导航"></nav>
    <div class="rail-foot">
      <div class="bubble" id="mood">（打哈欠）灯还亮着<small>有事喊一声就好</small></div>
      <div class="rail-meta"><span class="live"><i></i><span id="connection">正在叫她…</span></span></div>
    </div>
  </aside>
  <main class="main">
    <header class="bar">
      <div class="bar-l"><span class="crumb" id="crumb"></span><span class="bar-hint" id="bar-hint"></span></div>
      <div class="bar-r"><time id="clock"></time><span class="chip" id="chip"></span></div>
    </header>
    <div class="page" id="page"></div>
    <footer class="foot"><span id="workspace"></span><span id="theme-signature">冥零 · 夜色相伴</span></footer>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="notification" role="alert"></div>
<dialog id="editor"><h2>这句话，你来写</h2><p>写给 Agent 看的求助，越具体越好。</p><textarea id="ask-text" rows="8" aria-label="求助文字"></textarea><div class="actions"><button class="primary" id="save-ask">就这样</button><button id="cancel-ask">算了</button></div></dialog>
<script>/*@js*/</script>
</body>
</html>
